services:
  # 1. API Backend Web Service
  - type: web
    name: phonemail-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run render:api-build
    startCommand: npm run render:api-start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: phonemail-db
          property: connectionString

  # 2. Web Frontend Static Site
  - type: web
    name: phonemail-web
    runtime: static
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: phonemail-api
          property: url
          path: /api

databases:
  # 3. Render Managed PostgreSQL Database (Ensures all data changes are reflected and persisted)
  - name: phonemail-db
    plan: free
    region: singapore
    databaseName: phonemail
    user: phonemail
